name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: request-recorder-linux-amd64
          path: |
            dist/*.zip
            dist/checksums.txt

  published-store:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install the published plugin through the real CPA store client
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CPA_STORE_CHECK_MODE: live
        run: bash scripts/check_store_contract.sh latest
