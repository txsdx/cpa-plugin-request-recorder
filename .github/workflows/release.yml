name: Build and release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（如 0.1.0）；留空按已有正式版本标签递增 patch，首版 0.1.0'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# Bundle the image decoder; no system codec library is required.
env:
  GOFLAGS: -tags=nodynamic

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: metadata
        name: Validate release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release_metadata.py >> "$GITHUB_OUTPUT"
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  linux:
    name: Linux ${{ matrix.arch }} (glibc)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Match the Debian 12 libc baseline used by the examined CPA Dockerfile.
    container: golang:1.26.10-bookworm
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - name: Install packaging tools
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Test and package native plugin
        run: |
          go test -race ./...
          make package VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-linux-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  desktop:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MinGW
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Select Windows C compiler
        if: runner.os == 'Windows'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          compiler_dir = Path(os.environ['MSYS2_LOCATION']) / 'mingw64' / 'bin'
          compiler = compiler_dir / 'gcc.exe'
          assert compiler.is_file(), compiler
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('CC=' + compiler.as_posix() + '\n')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as f:
              f.write(str(compiler_dir) + '\n')
          PYTHON
      - name: Test and package native plugin
        run: |
          go test -race ./...
          mkdir -p dist
          CGO_ENABLED=1 go build -buildvcs=false -trimpath -buildmode=c-shared \
            -ldflags "-X github.com/txsdx/cpa-plugin-request-recorder/internal/recorder.Version=$VERSION" \
            -o "dist/request-recorder.${{ matrix.os == 'windows' && 'dll' || 'dylib' }}" ./cmd/plugin
          python scripts/package.py "$VERSION" "$GOOS" "$GOARCH" "${{ matrix.os == 'windows' && 'dll' || 'dylib' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  runtime:
    name: Real CPA capture with and without request-log
    needs: [validate, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: router-for-me/CLIProxyAPI
          ref: 307803510bce87f986fcf7b1a84190f105c7b4aa
          path: cpa-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cpa-source/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: plugin-linux-amd64
          path: dist
      - name: Extract tested native plugin
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import os, zipfile
          with zipfile.ZipFile('dist/request-recorder_' + os.environ['VERSION'] + '_linux_amd64.zip') as archive:
              archive.extract('request-recorder.so', 'dist')
          PYTHON
      - name: Build pinned CPA host
        working-directory: cpa-source
        run: go build -o "$RUNNER_TEMP/recorder-cpa-host" ./cmd/server
      - name: Verify complete conversations and original images
        run: |
          CPA_BIN="$RUNNER_TEMP/recorder-cpa-host" python3 scripts/integration.py
          RECORDER_TEST_LOGS=0 CPA_BIN="$RUNNER_TEMP/recorder-cpa-host" python3 scripts/integration.py

  publish:
    needs: [validate, linux, desktop, runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true
      - name: Verify all five archives and generate checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 scripts/release_metadata.py --verify-assets
          python3 scripts/generate_registry.py --version "$VERSION"
      - name: Validate registry and all archives with the real CPA installer
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/check_store_contract.sh "$VERSION"
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash scripts/publish_release.sh
      - name: Verify published private-store installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CPA_STORE_CHECK_MODE: live
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/check_store_contract.sh "$VERSION"
