# Merge into the existing CPA config, do not replace provider/auth settings.
# Legacy keys below also work with the examined CPA v8 compatibility loader.
# Optional: enable only for extra provider pre-translation body capture.
# Model results are captured by response hooks even with request-log disabled.
request-log: false
usage-statistics-enabled: true
plugins:
  enabled: true
  dir: plugins
  configs:
    request-recorder:
      enabled: true
      priority: -1000
      db_path: data/request-recorder.db
      # Active DB cap (1 GiB); oldest records are evicted automatically.
      # Image files and CPA source logs have separate storage limits.
      max_database_bytes: 1073741824
      refresh_interval_seconds: 1
      # Optional: set to CPA's actual log directory when request-log is enabled.
      logs_dir: ""
      # Empty derives data/request-recorder-images/ from db_path.
      images_dir: ""
      archive_remote_images: true
      # Compressed WebP preview; original downloads stay unchanged.
      preview_quality: 75
      preview_max_dimension: 1600
      max_image_bytes: 20971520
      max_image_storage_bytes: 2147483648
      max_image_files: 100000
      max_images_per_record: 64
      image_workers: 2
      image_download_timeout_seconds: 20
      retention_days: 30
      max_records: 100000
      # Also bounds the complete conversation history; oversized turns preserve the previous snapshot.
      max_body_bytes: 67108864
      max_memory_bytes: 268435456
      max_inflight: 256
